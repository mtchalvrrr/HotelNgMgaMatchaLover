<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation history · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><div th:replace="~{fragments :: alerts}"></div><h1 class="page-title">Reservation history</h1><a class="under-link" href="/manager">← Dashboard</a><div class="section-heading" style="margin-top:28px"><span class="muted">Processed reservations and cancellations</span><form th:if="${!#lists.isEmpty(reservations.?[status != 'PENDING' and status != 'CANCELLATION_REQUESTED' and (historyVisible == null or historyVisible)])}" th:action="@{/manager/history/clear}" method="post" data-confirm="Permanently delete all processed history? Pending requests will remain. This cannot be undone."><button class="button tiny" type="submit">Delete all history</button></form></div><div th:if="${#lists.isEmpty(reservations.?[status != 'PENDING' and status != 'CANCELLATION_REQUESTED' and (historyVisible == null or historyVisible)])}" class="empty-state"><h2>No processed history yet.</h2></div><div class="table-wrap" th:unless="${#lists.isEmpty(reservations.?[status != 'PENDING' and status != 'CANCELLATION_REQUESTED'])}"><table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="r : ${reservations}" th:if="${r.status != 'PENDING' and r.status != 'CANCELLATION_REQUESTED' and (r.historyVisible == null or r.historyVisible)}"><td><strong th:text="${r.customer.fullName}">Guest</strong><small class="cell-sub" th:text="${r.customer.email}">Email</small></td><td th:text="${r.room.type} + ' · ' + ${r.room.roomNumber}">Room</td><td th:text="${r.checkIn} + ' → ' + ${r.checkOut}">Dates</td><td><span class="status" th:text="${r.status}" th:classappend="${r.status.toLowerCase()}">APPROVED</span></td><td><form th:action="@{'/manager/history/' + ${r.id} + '/delete'}" method="post" data-confirm="Permanently delete this history record? This cannot be undone."><button class="button tiny" type="submit">Delete</button></form></td></tr></tbody></table></div></main><script src="/js/app.js"></script>
<!-- Revalidate protected page after browser history restore -->
<script>
window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
        window.location.reload();
    }
});
</script>

</body></html>
