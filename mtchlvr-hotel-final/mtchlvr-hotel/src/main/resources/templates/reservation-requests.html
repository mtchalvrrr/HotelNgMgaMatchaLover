<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation requests · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap manager-page"><div th:replace="~{fragments :: alerts}"></div><div class="manager-layout"><div th:replace="~{fragments :: managerSideNav}"></div><section class="manager-content"><h1 class="page-title">Reservation requests</h1><a class="under-link" href="/manager">← Dashboard</a><div th:if="${#lists.isEmpty(reservations.?[status == 'PENDING' or status == 'CANCELLATION_REQUESTED'])}" class="empty-state"><h2>No requests to review.</h2></div><div class="table-wrap" th:unless="${#lists.isEmpty(reservations.?[status == 'PENDING' or status == 'CANCELLATION_REQUESTED'])}"><table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th><th>Decision</th></tr></thead><tbody><tr th:each="r : ${reservations}" th:if="${r.status == 'PENDING' or r.status == 'CANCELLATION_REQUESTED'}"><td><strong th:text="${r.customer.fullName}">Guest</strong><small class="cell-sub" th:text="${r.customer.email}">Email</small></td><td th:text="${r.room.type} + ' · ' + ${r.room.roomNumber}">Room</td><td th:text="${r.checkIn} + ' → ' + ${r.checkOut}">Dates</td><td><span class="status" th:text="${r.status}" th:classappend="${r.status.toLowerCase()}">PENDING</span></td><td><form th:action="@{'/manager/reservations/' + ${r.id} + '/status'}" method="post" class="inline-form" data-confirm="Confirm this reservation decision?"><select name="status" aria-label="New reservation status"><option value="APPROVED" th:if="${r.status == 'PENDING'}">Approve</option><option value="REJECTED" th:if="${r.status == 'PENDING'}">Reject</option><option value="CANCELLED" th:if="${r.status == 'CANCELLATION_REQUESTED'}">Confirm cancellation</option><option value="APPROVED" th:if="${r.status == 'CANCELLATION_REQUESTED'}">Keep reservation</option></select><button class="button tiny" type="submit">Save</button></form></td></tr></tbody></table></div></section></div></main><script src="/js/app.js"></script></body></html>
