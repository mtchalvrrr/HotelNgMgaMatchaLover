<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room management · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><div th:replace="~{fragments :: alerts}"></div><h1 class="page-title">Room management</h1><a class="under-link" href="/manager">← Dashboard</a><div class="table-wrap" style="margin-top:28px"><table><thead><tr><th>Room</th><th>Type</th><th>Capacity</th><th>Rate / night</th><th>Availability</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="room : ${rooms}"><td th:text="${room.roomNumber}">101</td><td th:text="${room.type}">Standard</td><td th:text="${room.capacity} + ' guests'">2 guests</td><td th:text="'₱' + ${#numbers.formatDecimal(room.nightlyRate,1,'COMMA',0,'POINT')}">₱1,800</td><td th:text="${room.available ? 'Available' : 'Unavailable'}">Available</td><td th:text="${room.active ? 'Active' : 'Inactive'}">Active</td><td><form th:if="${room.active}" th:action="@{'/manager/rooms/' + ${room.id} + '/deactivate'}" method="post" data-confirm="Deactivate this room? It will be hidden from new bookings, but its reservation history will be kept."><button class="button tiny" type="submit">Deactivate</button></form><form th:unless="${room.active}" th:action="@{'/manager/rooms/' + ${room.id} + '/reactivate'}" method="post" data-confirm="Reactivate this room for bookings?"><button class="button tiny" type="submit">Reactivate</button></form></td></tr></tbody></table></div></main><script src="/js/app.js"></script>
<!-- Revalidate protected page after browser history restore -->
<script>
window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
        window.location.reload();
    }
});
</script>

</body></html>
