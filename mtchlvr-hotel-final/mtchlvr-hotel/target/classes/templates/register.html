<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-body"><a class="brand auth-brand" href="/"><span class="brand-mark">m</span><span>mtchlvr <small>HOTEL</small></span></a><main class="auth-card"><span class="eyebrow">MAKE YOURSELF AT HOME</span><h1>Your stay starts <em>here.</em></h1><p class="muted">Create your account and complete the quick security check.</p><form th:action="@{/register}" th:object="${form}" method="post" class="stack-form"><div th:if="${#fields.hasErrors('*')}" class="alert error">Please review the highlighted details and try again.</div><label>Full name<input th:field="*{fullName}" required minlength="2" maxlength="80"><small th:errors="*{fullName}"></small></label><label>Email address<input type="email" th:field="*{email}" required maxlength="160"><small th:errors="*{email}"></small></label><label>Password<div class="password-field"><input id="registerPassword" type="password" th:field="*{password}" required minlength="10" maxlength="72" autocomplete="new-password"><button type="button" class="password-toggle" data-password-toggle="registerPassword" aria-label="Show password" aria-pressed="false">Show</button></div><small>At least 10 characters, including uppercase and lowercase letters, a number, and a special symbol. Spaces are not allowed.</small><small th:errors="*{password}"></small></label><label>Confirm password<div class="password-field"><input id="confirmPassword" type="password" th:field="*{confirmPassword}" required autocomplete="new-password"><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false">Show</button></div><small th:errors="*{confirmPassword}"></small></label><div class="captcha-wrap"><div class="g-recaptcha" th:attr="data-sitekey=${@environment.getProperty('google.recaptcha.site-key', '')}"></div><small class="muted">Complete Google reCAPTCHA to create your account.</small><small th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></small></div><button class="button wide" type="submit">Create account ↗</button></form><p class="auth-switch">Already a guest? <a href="/login">Sign in</a></p></main><script src="https://www.google.com/recaptcha/api.js" async defer></script><script src="/js/app.js"></script><div th:replace="~{fragments :: chatbot}"></div></body></html>
