spring.application.name=mtchlvr-hotel
server.port=8080
# Honor forwarded host and protocol headers when deployed behind a trusted reverse proxy (e.g. Codespaces).
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:sqlite:./data/mtchlvr.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


# Google reCAPTCHA v2 checkbox keys (configure environment variables before running)
google.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
google.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# Groq AI chatbot
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b
